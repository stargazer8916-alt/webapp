<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Clicker</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
  color: white;
  text-align: center;
  overflow: hidden;
}

.container {
  padding: 20px;
}

h1 {
  font-size: 28px;
  text-shadow: 0 0 15px #00eaff;
}

.balance {
  font-size: 22px;
  margin: 10px 0;
  color: #00ffd5;
}

.click-btn {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: linear-gradient(145deg, #00eaff, #0066ff);
  box-shadow: 0 0 30px #00eaff;
  border: none;
  font-size: 40px;
  cursor: pointer;
  transition: transform 0.1s;
}

.click-btn:active {
  transform: scale(0.9);
}

.upgrades {
  margin-top: 20px;
}

.btn {
  background: #111;
  border: 1px solid #00eaff;
  color: white;
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  cursor: pointer;
}

.floating {
  position: absolute;
  font-size: 20px;
  pointer-events: none;
  animation: floatUp 1s ease-out forwards;
}

@keyframes floatUp {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-100px); }
}

.progress {
  height: 10px;
  background: #222;
  border-radius: 10px;
  margin-top: 15px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00eaff, #00ff95);
  transition: width 0.2s;
}
</style>
</head>

<body>

<div class="container">
  <h1>⛏️ NEON CLICKER</h1>

  <div class="balance">💎 Баланс: <span id="balance">0</span></div>
  <div>⚡ Сила: <span id="power">1</span></div>

  <button class="click-btn" id="clickBtn">💎</button>

  <div class="progress">
    <div class="bar" id="progressBar"></div>
  </div>

  <div class="upgrades">
    <button class="btn" onclick="upgrade()">🚀 Улучшить</button>
    <button class="btn" onclick="save()">💾 Сохранить</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let balance = 0;
let power = 1;
let clicks = 0;
let progress = 0;

const balanceEl = document.getElementById('balance');
const powerEl = document.getElementById('power');
const btn = document.getElementById('clickBtn');
const bar = document.getElementById('progressBar');

// === КЛИК ===
btn.addEventListener('click', (e) => {
  balance += power;
  clicks++;
  progress += 5;

  if (progress > 100) progress = 100;

  updateUI();
  spawnEffect(e);
});

// === ОБНОВЛЕНИЕ UI ===
function updateUI() {
  balanceEl.innerText = balance.toFixed(1);
  powerEl.innerText = power.toFixed(1);
  bar.style.width = progress + "%";
}

// === ЭФФЕКТ ПЛЮСИКОВ ===
function spawnEffect(e) {
  const el = document.createElement('div');
  el.className = 'floating';
  el.innerText = '+' + power;

  el.style.left = e.clientX + 'px';
  el.style.top = e.clientY + 'px';

  document.body.appendChild(el);

  setTimeout(() => el.remove(), 1000);
}

// === УЛУЧШЕНИЕ ===
function upgrade() {
  const cost = Math.floor(power * 100);

  if (balance < cost) {
    shake();
    return alert("Недостаточно 💎");
  }

  balance -= cost;
  power += 0.5;

  glow();
  updateUI();

  sendUpgrade();
}

// === СОХРАНЕНИЕ ===
function save() {
  sendData();
  flash();
}

// === ОТПРАВКА ДАННЫХ ===
function sendData() {
  tg.sendData(JSON.stringify({
    action: "save_clicks",
    clicks: clicks
  }));

  clicks = 0;
}

// === ОТПРАВКА АПГРЕЙДА ===
function sendUpgrade() {
  tg.sendData(JSON.stringify({
    action: "upgrade"
  }));
}

// === АНИМАЦИИ ===
function shake() {
  document.body.style.transform = "translateX(10px)";
  setTimeout(() => {
    document.body.style.transform = "translateX(-10px)";
  }, 50);
  setTimeout(() => {
    document.body.style.transform = "translateX(0)";
  }, 100);
}

function glow() {
  btn.style.boxShadow = "0 0 50px #00ff00";
  setTimeout(() => {
    btn.style.boxShadow = "0 0 30px #00eaff";
  }, 200);
}

function flash() {
  document.body.style.background = "#0f0";
  setTimeout(() => {
    document.body.style.background = "";
  }, 100);
}

// === АВТО СОХРАНЕНИЕ ===
setInterval(() => {
  if (clicks > 0) {
    sendData();
  }
}, 10000);

// === ПЛАВНЫЙ ФОН ===
let hue = 0;
setInterval(() => {
  hue += 1;
  document.body.style.background = `hsl(${hue}, 40%, 15%)`;
}, 100);

// INIT
updateUI();
</script>

</body>
  </html>
