<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        :root {
            --bg-color: #05050a;
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(188, 19, 254, 0.08), transparent 25%);
        }

        /* --- HEADER (Стеклянная панель сверху) --- */
        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .header h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        /* --- ИГРОВАЯ ЗОНА (Клик по кристаллу) --- */
        .game-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .crystal-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .crystal-container:active {
            transform: scale(0.92);
        }

        /* Свечение за кристаллом */
        .crystal-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,243,255,0.4) 0%, transparent 60%);
            border-radius: 50%;
            animation: pulseGlow 2s infinite alternate ease-in-out;
            z-index: 1;
        }

        /* SVG Кристалл */
        .crystal-svg {
            width: 160px;
            height: 160px;
            z-index: 2;
            filter: drop-shadow(0 0 15px var(--neon-blue));
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        /* --- АНИМАЦИЯ ВЫЛЕТАЮЩИХ ЦИФР --- */
        .floating-number {
            position: absolute;
            color: #fff;
            font-weight: 700;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--neon-purple);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

        /* --- FOOTER (Кнопки) --- */
        .footer {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: linear-gradient(to top, rgba(5,5,10,1) 50%, transparent);
            z-index: 10;
        }

        .btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 18px 0;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: translateY(2px);
        }

        .btn span {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
            font-weight: 400;
        }

        .btn-upgrade {
            border-color: rgba(188, 19, 254, 0.5);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
        }

        .btn-save {
            border-color: rgba(0, 243, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            background: rgba(0, 243, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Добыто за сессию</h1>
        <div class="score-display" id="score">0</div>
    </div>

    <div class="game-area" id="gameArea">
        <div class="crystal-container" id="crystalBtn">
            <div class="crystal-glow"></div>
            <svg class="crystal-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 9L12 22L22 9L12 2Z" fill="url(#paint0_linear)"/>
                <path d="M12 2L2 9L12 14L22 9L12 2Z" fill="url(#paint1_linear)"/>
                <path d="M2 9L12 22V14L2 9Z" fill="url(#paint2_linear)"/>
                <defs>
                    <linearGradient id="paint0_linear" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#00F3FF"/>
                        <stop offset="1" stop-color="#0044FF"/>
                    </linearGradient>
                    <linearGradient id="paint1_linear" x1="12" y1="2" x2="12" y2="14" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#BC13FE"/>
                        <stop offset="1" stop-color="#5E00FF"/>
                    </linearGradient>
                    <linearGradient id="paint2_linear" x1="7" y1="9" x2="7" y2="22" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#00F3FF" stop-opacity="0.8"/>
                        <stop offset="1" stop-color="#000000" stop-opacity="0.2"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
    </div>

    <div class="footer">
        <button class="btn btn-upgrade" onclick="sendUpgrade()">
            🚀 Улучшить
            <span>За алмазы в боте</span>
        </button>
        <button class="btn btn-save" onclick="sendSave()">
            💾 Сохранить
            <span>Записать на баланс</span>
        </button>
    </div>

    <script>
        // Инициализация Telegram Web App API
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран
        tg.ready();

        let sessionClicks = 0;
        const scoreElement = document.getElementById('score');
        const crystalBtn = document.getElementById('crystalBtn');
        const gameArea = document.getElementById('gameArea');

        // Обработчик клика по кристаллу
        crystalBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Предотвращаем двойное срабатывание на телефонах
            
            // Обрабатываем все одновременные касания (мультитач)
            for (let i = 0; i < e.changedTouches.length; i++) {
                handleTap(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
            }
        });

        // Запасной вариант для мыши (если открыто с ПК)
        crystalBtn.addEventListener('mousedown', (e) => {
            handleTap(e.clientX, e.clientY);
        });

        function handleTap(x, y) {
            sessionClicks++;
            scoreElement.innerText = sessionClicks;

            // Тактильный отклик (вибрация)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            // Создаем анимацию вылетающей цифры
            createFloatingNumber(x, y);
        }

        function createFloatingNumber(x, y) {
            const el = document.createElement('div');
            el.className = 'floating-number';
            el.innerText = '+1'; // Визуальный счетчик кликов
            
            // Немного смещаем координаты, чтобы цифра появлялась точно под пальцем
            el.style.left = (x - 10) + 'px';
            el.style.top = (y - 20) + 'px';

            gameArea.appendChild(el);

            // Удаляем элемент после завершения анимации (0.8s)
            setTimeout(() => {
                el.remove();
            }, 800);
        }

        // Связь с ботом
        function sendSave() {
            if (sessionClicks === 0) {
                tg.close();
                return;
            }
            // Отправляем данные в бота и закрываем окно
            tg.sendData(JSON.stringify({ action: 'save_clicks', clicks: sessionClicks }));
            tg.close();
        }

        function sendUpgrade() {
            // Отправляем команду улучшения в бота
            tg.sendData(JSON.stringify({ action: 'upgrade' }));
            tg.close();
        }
    </script>
</body>
</html>
